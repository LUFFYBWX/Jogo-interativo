name: Android APK

on:
  push:
    branches:
      - feature/world-tower-wars
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jogo-interativo
        uses: actions/checkout@v4
      - name: Checkout LiveCraft TikTok connector
        uses: actions/checkout@v4
        with:
          repository: LUFFYBWX/LiveCraft
          ref: fix/tiktok-username-config
          path: LiveCraft
      - name: Copy tested Rust connector core
        run: |
          mkdir -p native/live-rs
          cp -R LiveCraft/native/live-rs/. native/live-rs/
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "ndk;27.2.12479018"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build native TikTok connector
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd native/jni
          cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-push-battle-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
