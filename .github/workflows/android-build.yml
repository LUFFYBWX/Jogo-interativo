name: Android debug build

on:
  push:
    branches:
      - feature/world-tower-wars
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jogo-interativo
        uses: actions/checkout@v4
      - name: Checkout LiveCraft TikTok connector
        uses: actions/checkout@v4
        with:
          repository: LUFFYBWX/LiveCraft
          ref: fix/tiktok-username-config
          path: LiveCraft
      - name: Copy tested Rust connector core
        run: |
          mkdir -p native/live-rs
          cp -R LiveCraft/native/live-rs/. native/live-rs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build TikTok native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cd native/jni
          cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Publish APK directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk \
            --title "World Tower Wars build #${GITHUB_RUN_NUMBER}" \
            --notes "APK gerado automaticamente pelo GitHub Actions." \
            --target "${GITHUB_SHA}" \
            --latest
